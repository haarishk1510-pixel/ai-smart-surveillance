<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1113;
  --panel:#151b1e;
  --panel-2:#1c2428;
  --line:#2c373c;
  --text:#e8edea;
  --muted:#9daaa5;
  --good:#46c98b;
  --bad:#ff6a57;
  --accent:#f2b441;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);line-height:1.55}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:500 15px var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#17130a}
.btn-primary:hover{background:#f7c566;border-color:#f7c566}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid currentColor;font:500 12px var(--mono);white-space:nowrap}
.pill-good{color:var(--good)}
.pill-bad{color:var(--bad)}
.pill-idle{color:var(--muted)}
</style>
