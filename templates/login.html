<!DOCTYPE html>
<html>
<head>
    <title>AI Surveillance Admin</title>
    <style>
        body {
            background:#0f0f0f;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:white;
        }
        .box {
            background:#1e1e1e;
            padding:40px;
            border-radius:12px;
            width:320px;
            text-align:center;
            box-shadow:0 0 20px rgba(0,0,0,0.6);
        }
        input {
            width:100%;
            padding:12px;
            margin:12px 0;
            border:none;
            border-radius:6px;
        }
        button {
            width:100%;
            padding:12px;
            background:#ff4444;
            border:none;
            border-radius:6px;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
        button:hover {
            background:#ff2222;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>AI Surveillance Admin</h2>
    {% if demo %}<p>Live demo with sample data.<br>Sign in with <b>admin</b> / <b>admin</b></p>{% endif %}
    {% if error %}<p style="color:#ff4444;">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
