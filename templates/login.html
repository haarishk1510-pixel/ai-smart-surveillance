<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | AI Smart Surveillance</title>
{% include "_theme.html" %}
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;padding:32px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
h1{font-size:22px;font-weight:600;margin:8px 0 18px}
label{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted)}
input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--ink);color:var(--text);font:400 16px var(--sans)}
.btn{width:100%;margin-top:20px}
.hint{margin:0 0 6px;font-size:14px;color:var(--muted)}
.error{margin:0 0 6px;font-size:14px;color:var(--bad)}
.back{display:block;margin-top:16px;text-align:center;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="box">
  <div class="eyebrow">Admin console</div>
  <h1>AI Smart Surveillance</h1>
  {% if demo %}<p class="hint">Live demo with sample data. Sign in with <b>admin</b> / <b>admin</b>.</p>{% endif %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="POST">
    <label for="username">Username</label>
    <input id="username" type="text" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  {% if demo %}<a class="back" href="/">Back to project page</a>{% endif %}
</div>
</body>
</html>
